<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#f7f6f2">
  <title>Moskevská · Fotografie bytu</title>
  <link rel="stylesheet" href="galerie.css?v=3">
  <script src="galerie.js?v=3" type="module"></script>
</head>
<body>
  <header class="mast"><div class="wrap mast-inner"><span class="studio"><i aria-hidden="true"></i> FD Studio</span><span>Kontrola fotografií</span></div></header>
  <main class="wrap">
    <div class="title-row"><div><p class="location">Moskevská</p><h1>Fotografie bytu</h1></div><p class="review-progress" id="progress" hidden></p></div>
    <p id="access" role="status">Načítám porovnání…</p>
    <nav class="gallery-nav" id="gallery-nav" aria-label="Fotografie" hidden>
      <div class="thumbnails" id="thumbnails"></div>
    </nav>
    <div class="layout" id="workspace" hidden>
      <section class="comparison" aria-label="Porovnání fotografie">
        <div class="photo-heading"><div><h2 id="photo-title"></h2><p id="photo-number"></p></div><div class="photo-arrows"><button type="button" id="previous" aria-label="Předchozí fotka">‹</button><button type="button" id="next" aria-label="Další fotka">›</button></div></div>
        <div class="figure" id="figure" aria-busy="false">
          <img id="after" alt="Předsíň po úklidu" draggable="false">
          <img id="before" alt="Předsíň před úklidem" draggable="false">
          <span class="tag left" id="leftTag">Před</span><span class="tag right" id="rightTag">Po</span>
          <div class="divider" id="divider" aria-hidden="true"><span class="handle"><i></i><i></i></span></div>
          <input type="range" id="split" min="0" max="100" value="50" aria-label="Podíl původní fotografie" aria-describedby="compare-help">
          <button type="button" id="pick" hidden aria-label="Vybrat bod na fotografii"></button>
          <div id="markers" class="markers" aria-hidden="true"></div>
        </div>
        <div class="caption"><p id="compare-help"></p><label id="version-box"><span id="version"></span><select id="versions" aria-label="Zobrazit verzi" hidden></select></label><a id="download" class="download" hidden>Stáhnout JPG <span aria-hidden="true">↓</span></a></div>
      </section>
      <aside>
        <h2>Schválení a připomínky</h2>
        <div class="approval"><button type="button" id="approve" class="approve" disabled><span id="approve-label">OK · Schválit fotku</span><span aria-hidden="true">✓</span></button><button type="button" id="unapprove" class="text-action" hidden>Zrušit schválení</button></div>
        <form id="form">
          <div class="point-row"><button class="text-action" type="button" id="point"><span aria-hidden="true">⌖</span> <span id="point-label">Přidat bod do fotky</span></button></div>
          <div id="point-drafts" class="point-drafts"></div>
          <label for="text">Připomínka k celé fotce</label>
          <textarea id="text" rows="3" maxlength="1600" placeholder="Pokud se úprava týká celého snímku…"></textarea>
          <button type="submit" class="primary" id="submit"><span id="submit-label">Odeslat připomínku</span><span aria-hidden="true">↗</span></button>
          <p class="feedback" id="notice" role="status" aria-live="polite"></p>
        </form>
        <div class="history"><h3>Historie této fotky</h3><div id="notes"><p>Načítám…</p></div><button type="button" class="text-action" id="retry" hidden>Načíst znovu</button></div>
      </aside>
    </div>
  </main>
</body></html>
