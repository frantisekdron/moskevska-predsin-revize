<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#f6f4ef"><title>Březiněves · Před a po</title><link rel="stylesheet" href="gallery.css"><script defer src="gallery.js"></script></head>
<body><main><header><h1>Březiněves</h1><p>Fotografie před a po úpravě</p></header>
<section aria-label="Porovnání fotografií"><div class="toolbar"><h2 id="label"></h2><nav><button id="prev" aria-label="Předchozí fotografie">←</button><span id="count"></span><button id="next" aria-label="Další fotografie">→</button></nav></div>

<p id="status" role="status">Načítám fotografie…</p><p id="hint" hidden>Posuň dělicí čáru prstem a porovnej obě verze.</p></section>
<div id="groups"></div></main></body></html>
